name: CI

# Runs the test suites that already existed in this repo but had nothing
# running them. Before this workflow, 3dprintassistant/ had 54 tracked test
# files and a purpose-built drift gate, and no .github/ directory at all — so a
# guard that was red and a guard that worked looked identical. Two guards
# proved that the hard way: four browser-script suites went red for 23 days
# after an unrelated package.json change, and intake-run-wrapper.test.sh
# asserted a token the kickoff never contained, red from the very commit that
# introduced it.
#
# The suites are NOT uniform. There are four execution tiers, and running one
# tier the wrong way produces convincing false failures:
#
#   1. *.test.js                bare `node`; CJS via scripts/package.json
#   2. *.test.mjs standalone    bare `node`
#   3. vitest-claimed *.test.mjs  vitest ONLY — these import vitest, so running
#                               them under bare node fails 100% of the time
#   4. *.test.sh                shell; MIXED bash and zsh shebangs
#
# Tier 3 is why this workflow does not use one `find -name '*.test.*'` loop.
# That shape reports 9 false failures here. The tier-3 membership is asked of
# vitest itself (`vitest list --filesOnly`) rather than hardcoded to a path, so
# moving a Worker suite does not silently drop it from CI.
#
# Tier 4 is why the shell step runs ./"$f" rather than `bash "$f"`: a bash suite
# executed under zsh fails with zero output and exit 1, which reads exactly like
# a real failure.
#
# Selectors use `git ls-files`, never shell globs. A shell glob does not descend
# into subdirectories, and this repo has nested suites (scripts/lib/*.test.js,
# 14 of 15 *.test.mjs). An early draft of this file silently skipped
# scripts/lib/intake-source-normalizer.test.js for exactly that reason.
#
# Step 6 reconciles the SET of files that ran against a deliberately broader
# selector for "looks like a test", so a future suite that no tier claims fails
# the build instead of sitting quietly uncovered. The breadth is the point: an
# earlier version compared counts derived from the tiers' own globs, which made
# the check an algebraic identity that passed while a .test.ts ran nowhere.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + drift gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install zsh
        # Several shell suites declare #!/bin/zsh and ubuntu runners have no zsh.
        # Without this they would fail on the interpreter, not on their subject.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # ---------------------------------------------------------------- 1/6
      - name: "1/6 · Syntax check (all tracked .js)"
        # Catches a truncated or half-merged file before any suite runs, where
        # the failure would otherwise be blamed on the suite.
        #
        # --check picks its dialect from the nearest package.json, and the root
        # one says "type": "module". That is the WRONG dialect for the root
        # browser scripts: index.html loads them as classic sloppy-mode
        # <script> tags, so valid browser code (e.g. a `with` block) would be
        # rejected as a strict-mode error, while `export` syntax that would
        # break a <script src> would be accepted. Checking them as commonjs
        # (sloppy mode, like a classic script) is the closest accurate dialect.
        # This is the same misclassification that made four suites unreachable
        # in a62465e — worth not baking into the syntax gate as well.
        run: |
          set -uo pipefail

          # The sloppy-mode set is derived from index.html, not hardcoded, so a
          # new <script src> is classified correctly without touching this file.
          # Everything else is ESM under the root package.json — including
          # worker.js, which lives at the root but is the Worker's ESM entry and
          # is NOT loaded by index.html. scripts/** is CommonJS per its own
          # package.json.
          grep -oE '<script\b[^>]*\bsrc\s*=\s*"[^"]+"' index.html \
            | sed -E 's/.*src="([^"]+)".*/\1/' | sort > /tmp/classic-scripts.txt
          echo "index.html loads $(wc -l < /tmp/classic-scripts.txt | tr -d ' ') classic script(s)"

          errors=0
          while IFS= read -r f; do
            if grep -Fxq "$f" /tmp/classic-scripts.txt || [ "${f#scripts/}" != "$f" ]; then
              mode=commonjs
            else
              mode=module
            fi
            if ! node --input-type=$mode --check < "$f" 2>/dev/null; then
              echo "::error file=$f::Syntax error in $f (checked as $mode)"
              node --input-type=$mode --check < "$f" || true
              errors=1
            fi
          done < <(git ls-files '*.js')
          if [ "$errors" = 0 ]; then
            echo "All tracked .js files parse cleanly"
          fi
          exit $errors

      # ---------------------------------------------------------------- 2/6
      - name: "2/6 · Node suites (*.test.js)"
        run: |
          set -uo pipefail
          errors=0; count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if node "$f" > /tmp/suite.log 2>&1; then
              echo "  pass  $f"
            else
              echo "::error file=$f::Suite failed: $f"
              cat /tmp/suite.log
              errors=1
            fi
          done < <(git ls-files '*.test.js')
          git ls-files '*.test.js' | sort > /tmp/ran-js.txt
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.test.js found. Refusing to pass vacuously."
            exit 1
          fi
          echo "$count Node suites run"
          exit $errors

      # ---------------------------------------------------------------- 3/6
      - name: "3/6 · Standalone .mjs suites"
        # Everything vitest does NOT claim. Membership comes from vitest itself.
        run: |
          set -uo pipefail
          npx vitest list --filesOnly 2>/dev/null | sed 's|^\./||' | sort > /tmp/vitest-owned.txt
          echo "vitest claims $(wc -l < /tmp/vitest-owned.txt) file(s)"
          if [ ! -s /tmp/vitest-owned.txt ]; then
            echo "::error::vitest claimed zero files. Its config or discovery broke; step 4 would pass vacuously."
            exit 1
          fi
          errors=0; count=0
          while IFS= read -r f; do
            if grep -Fxq "$f" /tmp/vitest-owned.txt; then continue; fi
            count=$((count + 1))
            if node "$f" > /tmp/suite.log 2>&1; then
              echo "  pass  $f"
            else
              echo "::error file=$f::Suite failed: $f"
              cat /tmp/suite.log
              errors=1
            fi
          done < <(git ls-files '*.test.mjs')
          git ls-files '*.test.mjs' | grep -Fxv -f /tmp/vitest-owned.txt | sort > /tmp/ran-mjs.txt || true
          if [ "$count" -eq 0 ]; then
            echo "::error::Every *.test.mjs was claimed by vitest. Expected standalone suites too; refusing to pass vacuously."
            exit 1
          fi
          echo "$count standalone .mjs suites run"
          exit $errors

      # ---------------------------------------------------------------- 4/6
      - name: "4/6 · Worker suites (vitest)"
        run: npx vitest run

      # ---------------------------------------------------------------- 5/6
      - name: "5/6 · Shell suites"
        run: |
          set -uo pipefail
          errors=0; count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if [ ! -x "$f" ]; then
              echo "::error file=$f::$f is not executable — chmod +x it. Invoking it would exit 126."
              errors=1
              continue
            fi
            if ./"$f" > /tmp/suite.log 2>&1; then
              echo "  pass  $f"
            else
              echo "::error file=$f::Suite failed: $f"
              cat /tmp/suite.log
              # These suites run under `set -e` and assert with bare `[[ ... ]]`,
              # so a failing assertion aborts having printed NOTHING. An empty
              # log is therefore the common case, not the rare one, and it is
              # indistinguishable from a suite that never started. Re-run under
              # tracing so the last thing attempted is visible; without this a
              # CI-only failure cannot be diagnosed without another push.
              if [ ! -s /tmp/suite.log ]; then
                echo "--- no output; re-running under set -x (last 40 lines) ---"
                bash -x "$f" 2>&1 | tail -40 || true
              fi
              errors=1
            fi
          done < <(git ls-files '*.test.sh')
          git ls-files '*.test.sh' | sort > /tmp/ran-sh.txt
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.test.sh found. Refusing to pass vacuously."
            exit 1
          fi
          echo "$count shell suites run"
          exit $errors

      # ---------------------------------------------------------------- 6/6
      - name: "6/6 · Coverage reconciliation"
        # Every test-looking file in the repo must be claimed by exactly one
        # tier above. A suite with an extension or location no tier selects
        # would otherwise sit uncovered and look fine — the precise failure
        # this workflow exists to end.
        #
        # This compares FILE SETS, not counts, and the tracked side uses a
        # DELIBERATELY BROADER selector than any tier. An earlier version
        # counted `git ls-files '*.test.js' '*.test.mjs' '*.test.sh'` — the
        # same three globs the tiers use — which made ran == tracked an
        # algebraic identity: a NEVER_RUN.test.ts was invisible to both sides
        # and the step reported "all covered" while running nothing.
        #
        # if: success() — NOT always(). On a genuine suite failure the earlier
        # steps abort before writing their manifests, and an always() version
        # would then shout "Coverage gap" over the top of the real error with
        # advice pointing entirely the wrong way.
        if: success()
        run: |
          set -uo pipefail

          # Broad: anything a human would read as a test file, at any depth,
          # whatever the extension.
          git ls-files \
            | grep -E '(^|/)[^/]*[._](test|spec)\.[A-Za-z0-9]+$' \
            | sort > /tmp/tracked.txt

          cat /tmp/ran-js.txt /tmp/ran-mjs.txt /tmp/ran-sh.txt /tmp/vitest-owned.txt \
            2>/dev/null | sort > /tmp/ran.txt

          echo "tracked=$(wc -l < /tmp/tracked.txt | tr -d ' ')  ran=$(wc -l < /tmp/ran.txt | tr -d ' ')"

          # Claimed by no tier — the failure this step exists to catch.
          uncovered=$(comm -23 /tmp/tracked.txt /tmp/ran.txt)
          if [ -n "$uncovered" ]; then
            echo "::error::These test files are tracked but no tier ran them:"
            printf '  %s\n' $uncovered
            echo "Add a tier that selects them, or rename to a covered pattern."
            exit 1
          fi

          # Claimed by two tiers — double counting could mask an uncovered file.
          dupes=$(sort /tmp/ran.txt | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::These files were run by more than one tier:"
            printf '  %s\n' $dupes
            exit 1
          fi

          echo "Every tracked test file is claimed by exactly one tier."

  # ---------------------------------------------------------------------------
  # Deliberately a SEPARATE job, not a final step of `test`.
  #
  # As a step it would be skipped the moment any earlier suite failed, so a PR
  # that both broke one JS suite and drifted engine output would report only the
  # JS suite — the drift stays hidden until the unrelated failure is fixed, and
  # whoever fixes it has no reason to expect a second problem. These are
  # independent signals and both should always be reported.
  # ---------------------------------------------------------------------------
  engine-drift:
    name: Engine golden snapshot (drift gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No `npm ci`: engine-golden-snapshot.js uses only fs/path/vm. Installing
      # dependencies here would add a registry-outage failure mode to the drift
      # gate — a gate failing for a reason unrelated to drift is the pattern
      # this split was made to avoid.

      - name: Check for drift
        # The repo's own purpose-built guard: exits 1 if resolved profile output
        # drifts for any of the 39 recorded states. Re-baselining is deliberate
        # and reviewed; unintentional drift fails here.
        run: node scripts/engine-golden-snapshot.js --check
